name: Build POS Windows installer
on:
  workflow_dispatch:
  push:
    paths: ['pos-desktop/**']
    tags: ['pos-v*']
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pos-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: EasyPOS-Setup
          path: pos-desktop/dist/EasyPOS-Setup-*.exe
