<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}App{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #000; }

        /* Header */
        .header { position: fixed; top: 0; left: 0; right: 0; height: 60px; z-index: 1000; background: #fff;
                  border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 36px; height: 36px; border-radius: 8px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .logo-text h1 { font-size: 16px; font-weight: 700; line-height: 1.1; }
        .logo-text p { font-size: 11px; color: #666; }
        .header-right { display: flex; align-items: center; gap: 14px; }
        .user-chip { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
        .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; text-transform: uppercase; }
        .logout-link { color: #666; text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 6px; }
        .logout-link:hover { background: #f5f5f5; color: #000; }
        .menu-toggle { display: none; background: none; border: none; font-size: 18px; cursor: pointer; padding: 8px; }

        /* Layout */
        .container { position: fixed; top: 60px; bottom: 0; left: 0; right: 0; display: flex; overflow: hidden; }
        .sidebar { width: 250px; flex-shrink: 0; background: #fff; border-right: 1px solid #e5e5e5; overflow-y: auto; padding: 20px 12px; }
        .menu-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: #999; padding: 0 12px 10px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 8px; color: #333; text-decoration: none; font-size: 13px; font-weight: 500; margin-bottom: 2px; }
        .menu-item i { width: 18px; text-align: center; color: #666; }
        .menu-item:hover { background: #f5f5f5; }
        .menu-item.active { background: #000; color: #fff; }
        .menu-item.active i { color: #fff; }
        .main-content { flex: 1; height: 100%; overflow-y: auto; padding: 32px; }
        .overlay { display: none; position: fixed; inset: 60px 0 0 0; background: rgba(0,0,0,.4); z-index: 999; }

        /* Shared page pieces */
        .page-header { margin-bottom: 24px; }
        .page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .page-subtitle { font-size: 13px; color: #666; }
        .content-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 24px; }
        .card-title { font-size: 16px; font-weight: 600; }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .sidebar { position: fixed; top: 60px; bottom: 0; left: -260px; z-index: 1001; transition: left .25s; }
            .sidebar.open { left: 0; }
            .overlay.open { display: block; }
            .main-content { padding: 20px 16px; }
            .user-name { display: none; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
            <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <div class="logo-text">
                <h1>Login App</h1>
                <p>Management System</p>
            </div>
        </div>
        <div class="header-right">
            <div class="user-chip">
                <div class="user-avatar">{{ (username or '?')[0] }}</div>
                <span class="user-name">{{ username }}</span>
            </div>
            <a class="logout-link" href="{{ url_for('logout') }}"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="menu-title">Main Menu</div>
            <a href="{{ url_for('dashboard') }}" class="menu-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
                <i class="fa-solid fa-chart-line"></i><span>Dashboard</span>
            </a>
            <div class="menu-title" style="margin-top:18px;">User Master</div>
            <a href="{{ url_for('roles') }}" class="menu-item {% if request.endpoint == 'roles' %}active{% endif %}">
                <i class="fa-solid fa-user-shield"></i><span>User Role</span>
            </a>
        </aside>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }
    </script>
</body>
</html>
